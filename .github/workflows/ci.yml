name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

# The CI token only ever reads the repository.
permissions:
  contents: read

jobs:
  # Scans the whole history with the repo's .gitleaks.toml (fake test secrets are allowlisted).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c -
          tar -xzf "${ARCHIVE}" gitleaks
      - run: ./gitleaks detect --source . --redact --no-banner --verbose


  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test
      - run: npm run smoke:mcp
      - run: npm run docs:check

  # Windows (W1): the headless path only. Desktop tools are not implemented on Windows yet.
  # Informational until a run on windows-latest is green; then remove continue-on-error.
  windows-headless:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:windows
      - run: node scripts/windows-smoke.mjs

  benchmark-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run benchmark:suite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: benchmark-suite, path: benchmarks/suite/results/latest.json }
