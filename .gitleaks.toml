# Test fixtures that exercise AgentHost's own redaction deliberately contain fake secrets
# (tok_12345678, sk-abcdefghijklmnopqrstuvwxyz0123456789, a PEM header with no key). Nothing real is stored.
title = "AgentHost gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Fake secrets used by redaction tests"
paths = [
  '''__tests__/''',
  '''/dist/''',
]
