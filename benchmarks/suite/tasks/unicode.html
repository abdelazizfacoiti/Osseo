<!doctype html><meta charset="utf-8"><title>Unicode</title><style>body{font:16px sans-serif;margin:20px}label{display:block;margin:8px 0}td,th{border:1px solid #888;padding:4px 10px}</style>
<h1>Greeting</h1>
<label>Name <input id="n"></label>
<button id="b">Save</button>
<p id="out"></p>
<script>b.onclick=()=>{out.textContent='hello '+n.value+' ('+n.value.length+' chars)'}</script>
