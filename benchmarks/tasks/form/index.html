<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Application form</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; font: 15px sans-serif; }
  #banner { position: absolute; left: 0; top: 0; width: 100%; height: 50px; background: #e8ecff; display: none; }
  #stage { position: absolute; left: 40px; top: 40px; width: 420px; height: 240px; }
  #stage.shifted { top: 100px; }
  .field { position: absolute; left: 0; width: 320px; height: 32px; box-sizing: border-box; font: 15px sans-serif; }
  #name { top: 0; }
  #country { top: 60px; }
  #cv { top: 120px; }
  #save { position: absolute; left: 0; top: 180px; width: 160px; height: 36px; font: 15px sans-serif; }
  #result { position: absolute; left: 40px; top: 360px; margin: 0; }
</style>
</head>
<body>
<div id="banner">Notice: this application is saved as a draft.</div>
<div id="stage">
  <input id="name" class="field" aria-label="Name" autocomplete="off">
  <select id="country" class="field" aria-label="Country">
    <option value="">Choose</option>
    <option value="alpha">Alpha</option>
    <option value="beta">Beta</option>
  </select>
  <input id="cv" class="field" type="file" aria-label="CV">
  <button id="save" type="button" disabled>Save draft</button>
</div>
<p id="result" role="status"></p>
<script>
  const banner = document.getElementById('banner');
  const stage = document.getElementById('stage');
  const name = document.getElementById('name');
  const country = document.getElementById('country');
  const cv = document.getElementById('cv');
  const save = document.getElementById('save');
  const result = document.getElementById('result');
  // Layout shift: typing a name shows a notice that pushes the whole form down 60px.
  let shifted = false;
  const update = () => { save.disabled = !(name.value.trim() && country.value); };
  name.addEventListener('input', () => {
    if (!shifted) { shifted = true; banner.style.display = 'block'; stage.classList.add('shifted'); }
    update();
  });
  country.addEventListener('change', update);
  save.addEventListener('click', () => {
    const text = 'saved: ' + name.value + ' | ' + country.value + ' | ' + (cv.files[0] ? cv.files[0].name : 'no file');
    result.textContent = text;
    result.setAttribute('aria-label', text);
  });
</script>
</body>
</html>
